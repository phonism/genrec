site_name: GenRec
site_description: 生成式推荐研究框架、模型实现与领域知识库
site_author: Qi Lu
site_url: https://phonism.github.io/genrec/

repo_name: phonism/genrec
repo_url: https://github.com/phonism/genrec
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - toc.follow

# i18n 使用 folder 结构；导航路径必须不带 zh/ 或 en/ 前缀。
# 中文是规范版本，英文缺页会回退到中文页。
nav:
  - 首页: index.md
  - 入门:
      - 快速开始: getting-started.md
      - 安装与环境: installation.md
      - 示例: examples.md
      - 常见问题: faq.md
  - 模型与组件:
      - 模型总览: models/overview.md
      - 实现与复现状态: reference/model-status.md
      - 判别式基线:
          - SASRec: models/sasrec.md
          - HSTU: models/hstu.md
      - 语义 ID 组件:
          - RQ-VAE: models/rqvae.md
          - RQ-KMeans: models/rqkmeans.md
      - 自回归与混合生成:
          - TIGER: models/tiger.md
          - LCRec: models/lcrec.md
          - COBRA: models/cobra.md
          - OneRec: models/onerec.md
      - 其他生成与 LLM 路线:
          - RPG: models/rpg.md
          - NoteLLM: models/notellm.md
          - GRAM: models/gram.md
      - 模型文档模板: models/template.md
  - 实现架构:
      - 架构总览: architecture/index.md
      - 仓库地图: architecture/repository-map.md
      - 数据流水线: architecture/data-pipeline.md
      - Gin 配置系统: architecture/configuration.md
      - 训练系统与产物: architecture/training-system.md
      - 评估系统: architecture/evaluation-system.md
      - 可复现工作流: architecture/reproducibility.md
      - 扩展指南: architecture/extension-guide.md
  - 数据:
      - 数据集总览: dataset/overview.md
      - Amazon 2014 与 P5: dataset/p5-amazon.md
      - 自定义数据集: dataset/custom.md
  - 训练与实验:
      - 命令索引: reference/command-index.md
      - RQ-VAE 训练: training/rqvae.md
      - TIGER 训练: training/tiger.md
      - 179 并发安全运行手册: 179-reproduction-runbook.md
  - GenRec 研究全景:
      - 全景总览: landscape/index.md
      - 分类框架: landscape/taxonomy.md
      - 模型目录（含未实现）: landscape/model-catalog.md
      - 生成式推荐评测: landscape/evaluation.md
      - 数据集与划分: landscape/datasets.md
      - 阅读路线: landscape/reading-list.md
      - 实现与研究待办: landscape/implementation-backlog.md
  - 研究记录:
      - 研究进展入口: latest-advances.md
      - 复现行动计划（历史记录）: reproduction-roadmap.md
  - API 与代码契约:
      - API 总览: api/index.md
      - 通用序列数据层: api/base-dataset.md
      - 数据集与适配器: api/datasets.md
      - 数据处理与评估协议: api/processors.md
      - 数据路由与模型专用契约: api/dataset-factory.md
      - 配置与命令行: api/configs.md
      - 公共模块: api/modules.md
      - RQ 组件: api/rqvae.md
      - TIGER: api/tiger.md
      - 训练器: api/trainers.md
  - 维护与边界:
      - 术语与边界: reference/terminology.md
      - 部署边界: deployment.md
      - 贡献指南: contributing.md
      - 文档维护规范: reference/documentation-policy.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: phonism
      repo: genrec
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

